<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Component Library">
  <!--
    The mark is the product in one glyph: a component footprint (the solid inner
    die with its pads) enclosed by the gross solution rectangle (the dashed
    outline). Package size inside, board size outside — the distinction the whole
    application exists to make.
  -->
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa4ff"/>
      <stop offset="1" stop-color="#2f6fc4"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#0a0d12"/>

  <!-- Gross solution boundary -->
  <rect x="40" y="40" width="176" height="176" rx="14"
        fill="none" stroke="#4c9bff" stroke-opacity="0.55"
        stroke-width="6" stroke-dasharray="18 13" stroke-linecap="round"/>

  <!-- The die -->
  <rect x="88" y="88" width="80" height="80" rx="10" fill="url(#die)"/>
  <rect x="88" y="88" width="80" height="80" rx="10" fill="none"
        stroke="#8dc0ff" stroke-opacity="0.9" stroke-width="3"/>

  <!-- Pads: four per side, the standard reading of a QFN footprint -->
  <g fill="#4c9bff">
    <rect x="100" y="66" width="10" height="18" rx="3"/>
    <rect x="121" y="66" width="10" height="18" rx="3"/>
    <rect x="142" y="66" width="10" height="18" rx="3"/>

    <rect x="100" y="172" width="10" height="18" rx="3"/>
    <rect x="121" y="172" width="10" height="18" rx="3"/>
    <rect x="142" y="172" width="10" height="18" rx="3"/>

    <rect x="66" y="100" width="18" height="10" rx="3"/>
    <rect x="66" y="121" width="18" height="10" rx="3"/>
    <rect x="66" y="142" width="18" height="10" rx="3"/>

    <rect x="172" y="100" width="18" height="10" rx="3"/>
    <rect x="172" y="121" width="18" height="10" rx="3"/>
    <rect x="172" y="142" width="18" height="10" rx="3"/>
  </g>

  <!-- Pin-1 marker, as on a real package -->
  <circle cx="102" cy="102" r="6" fill="#0a0d12"/>
</svg>
