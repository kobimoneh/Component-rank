
# =============================================================================
# Component Newsletter — configuration
# =============================================================================
# This is the ONE file you edit to control what the tool tracks.
#
# Each category has a `metric:` — the single most important thing to rank by.
# Leave `best_in_class:` empty to run DISCOVERY mode: the tool finds and ranks
# the current best-in-class for that metric. Once you paste the winners into
# `best_in_class:`, the category switches to "what's new since last time" mode.
#
# Run with:   python run.py            (uses your Claude subscription by default)
# Reports land in ./reports/YYYY-MM.md
# =============================================================================

settings:
  # How the research runs:
  #   cli – drive the Claude Code CLI (`claude -p`); uses your Claude Pro/Max
  #         subscription and its built-in web search. No API key/credits needed.
  #   api – call the Anthropic API directly (needs ANTHROPIC_API_KEY + credits).
  backend: cli
  model: claude-opus-4-8
  effort: high
  lookback_days: 35          # only used in "what's new" mode

  # API backend only (search/fetch caps):
  max_searches_per_category: 12
  max_fetches_per_category: 8

  # CLI backend only:
  claude_bin: /home/user/.local/bin/claude   # absolute path so cron finds it
  timeout_seconds: 900       # per-category wall-clock limit

distributors:
  - Mouser
  - DigiKey
  - Arrow
  - Newark / Farnell
  - LCSC
  - RS Components

# Default manufacturer list (each category can override with its own list).
manufacturers:
  - STMicroelectronics
  - Texas Instruments
  - Analog Devices
  - NXP
  - Microchip
  - Renesas
  - Infineon
  - Nordic Semiconductor

# -----------------------------------------------------------------------------
# Categories.  metric = the one thing to rank by.  best_in_class: [] => discover.
# -----------------------------------------------------------------------------
categories:
  - name: "Very small LDO regulator"
    slug: tiny-ldo
    description: >
      Low-dropout linear regulators where PCB area is the priority — the
      physically smallest usable LDOs (tiny WLCSP/DFN/SOT packages).
    metric: "Smallest package footprint (mm²); then lowest quiescent current (Iq)"
    best_in_class:
      - "TPS7A0233PYCHR"
      - "NCP163AMX330TBG"
      - "ADP162ACBZ-3.3-R7"
      - "RP155Z004B-E2-F"
    key_parameters:
      - Package footprint (mm²) and type
      - Quiescent current (Iq)
      - Max output current
      - Dropout voltage
      - Vin / Vout range, PSRR
    manufacturers:
      - Texas Instruments
      - Analog Devices
      - Torex
      - Nisshinbo / NJR
      - Diodes Incorporated
      - STMicroelectronics
      - Microchip
      - Richtek

  - name: "Small buck converter, 5V → 3.3V"
    slug: buck-5v-3v3
    description: >
      Step-down DC-DC converters for a 5V input rail to 3.3V, optimized for the
      smallest total solution size (including inductor and caps).
    metric: "Smallest total solution footprint (IC + inductor + caps) for 5V→3.3V"
    best_in_class:
      - "MAXM38643AEMB+"
      - "TPS82740BSIPR"
      - "MPM3810GQB-Z"
      - "TPS82130SILR"
    key_parameters:
      - Total solution footprint
      - IC package size
      - Integrated vs external inductor
      - Max output current
      - Quiescent current / light-load efficiency
      - Switching frequency
    manufacturers:
      - Texas Instruments
      - Analog Devices
      - STMicroelectronics
      - Monolithic Power Systems (MPS)
      - Richtek
      - Diodes Incorporated

