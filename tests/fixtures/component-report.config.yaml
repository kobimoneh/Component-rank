# -----------------------------------------------------------------------------
# Email delivery (optional, OFF by default). SMTP password goes in .env as
# SMTP_PASSWORD, never here. For Gmail use a 16-char App Password.
#
# These addresses are placeholders because this file is tracked in a public
# repo. Put your real address in locally; to stop git from offering the change
# for commit, run:  git update-index --skip-worktree config.yaml
# -----------------------------------------------------------------------------
email:
  enabled: false
  to: ["you@example.com"]
  sender: "you@example.com"
  username: "you@example.com"
  smtp_host: smtp.gmail.com
  smtp_port: 587
  use_tls: true

# Which datasheets to download into the month's datasheets/ folder:
#   winners – best-in-class part of each category
#   all     – every featured part (winner + shortlist)
#   none    – download none (the PDF still lists download links)
datasheets:
  attach: all
  max_attachments: 200
  max_total_mb: 400
